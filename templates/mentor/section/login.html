{% extends "mentor/base.html" %}
{% load static %}

{% block contenu_principal %}
<div class="container py-5 mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-lg border-0" style="border-radius: 15px;">
                <div class="card-body p-5">
                    <h2 class="card-title text-center fw-bold mb-4">Connexion</h2>
                    <form method="post">
                        {% csrf_token %}
                        <input type="hidden" name="next" value="{{ request.GET.next }}">
                        
                        <div class="mb-3">
                            <label for="id_username" class="form-label fw-bold">Nom d'utilisateur</label>
                            <input type="text" name="username" class="form-control form-control-lg" id="id_username" required>
                        </div>
                        <div class="mb-4">
                            <label for="id_password" class="form-label fw-bold">Mot de passe</label>
                            <input type="password" name="password" class="form-control form-control-lg" id="id_password" required>
                        </div>
                        
                        <div class="d-grid">
                            <button type="submit" class="btn btn-success btn-lg">Se connecter</button>
                        </div>
                    </form>
                    <hr class="my-4">
                    <div class="text-center">
                        <p>Pas encore de compte ? <a href="{% url 'vie_estudiantine_una:register' %}">Inscrivez-vous ici</a>.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<style>
    .btn-success { background-color: #1a5c37; border: none; }
    .btn-success:hover { background-color: #27ae60; }
</style>
{% endblock %}
