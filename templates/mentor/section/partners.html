<section id="partners" class="partners-section py-5">
    <div class="container" data-aos="fade-up">
        
        <div class="text-center mb-5">
            <h5 class="fw-bold text-uppercase text-muted small ls-2">Ils nous font confiance</h5>
        </div>

        <div class="row g-4 align-items-center justify-content-center grayscale-wrapper">
            {% for partenaire in partenaires %}
            <div class="col-6 col-md-4 col-lg-2 text-center">
                <a href="{{ partenaire.site_web }}" target="_blank" class="partner-logo-link" title="{{ partenaire.nom }}">
                    {% if partenaire.logo %}
                    <img src="{{ partenaire.logo.url }}" class="img-fluid partner-img" alt="{{ partenaire.nom }}">
                    {% else %}
                    <span class="fw-bold text-muted">{{ partenaire.nom }}</span>
                    {% endif %}
                </a>
            </div>
            {% empty %}
            <div class="col-12 text-center text-muted small">
                <p>Devenez partenaire de l'UNA.</p>
            </div>
            {% endfor %}
        </div>
    </div>
</section>

<style>
    .partners-section {
        background-color: #ffffff;
        border-top: 1px solid #f0f0f0;
        border-bottom: 1px solid #f0f0f0;
    }

    .ls-2 { letter-spacing: 2px; }

    .partner-logo-link {
        display: block;
        padding: 15px;
        transition: all 0.3s ease;
        opacity: 0.6;
        filter: grayscale(100%);
    }

    .partner-img {
        max-height: 60px;
        width: auto;
        object-fit: contain;
        transition: all 0.3s ease;
    }

    .partner-logo-link:hover {
        opacity: 1;
        filter: grayscale(0%);
        transform: scale(1.05);
    }
</style>
