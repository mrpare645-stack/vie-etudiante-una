<section id="features" class="features-elite-section">
  
  <div class="container section-header-elite" data-aos="fade-up">
    <div class="header-badge">Académique</div>
    <h2 class="main-title">Nos <span class="green-text">Formations</span></h2>
    <p class="sub-title">Explorez les parcours d'excellence et les filières de l'UNA</p>
    <div class="title-divider"></div>
  </div>

  <div class="container">
    <div class="row gy-4">
      {% for filiere in filieres %}
      <div class="col-lg-3 col-md-4 col-sm-6" data-aos="fade-up" data-aos-delay="{{ forloop.counter }}00">
        <div class="filiere-card">
          <div class="card-glow"></div>
          
          <div class="filiere-icon-wrapper">
            <i class="bi {{ filiere.icon }}"></i>
          </div>
          
          <div class="filiere-content">
            <h3>
              <a href="https://www.univ-na.ci/formations.html" target="_blank" class="stretched-link">
                {{ filiere.nom }}
              </a>
            </h3>
            <span class="explore-text">Voir le parcours <i class="bi bi-arrow-right-short"></i></span>
          </div>
        </div>
      </div>
      {% endfor %}
    </div>
  </div>
</section>

<style>
  .features-elite-section {
    padding: 80px 0;
    background-color: #ffffff;
    font-family: 'Inter', sans-serif;
  }

  /* --- Header de Section --- */
  .section-header-elite {
    text-align: center;
    margin-bottom: 60px;
  }
  .header-badge {
    display: inline-block;
    background: #f1f8f4;
    color: #27ae60;
    padding: 6px 18px;
    border-radius: 50px;
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 15px;
  }
  .main-title {
    font-size: 2.5rem;
    font-weight: 800;
    color: #1a5c37;
    margin-bottom: 10px;
  }
  .green-text { color: #27ae60; }
  .sub-title {
    color: #7f8c8d;
    font-size: 1.1rem;
    max-width: 600px;
    margin: 0 auto 20px;
  }
  .title-divider {
    width: 50px;
    height: 4px;
    background: #27ae60;
    margin: 0 auto;
    border-radius: 10px;
  }

  /* --- Filière Card Design --- */
  .filiere-card {
    position: relative;
    background: #ffffff;
    border: 1px solid #edf2f0;
    padding: 30px 20px;
    border-radius: 20px;
    text-align: center;
    height: 100%;
    transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .filiere-icon-wrapper {
    width: 65px;
    height: 65px;
    background: #f1f8f4;
    color: #1a5c37;
    border-radius: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    margin-bottom: 20px;
    transition: 0.4s;
  }

  .filiere-card h3 {
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 12px;
    color: #2c3e50;
    line-height: 1.4;
  }

  .filiere-card h3 a {
    color: inherit;
    text-decoration: none;
  }

  .explore-text {
    font-size: 12px;
    font-weight: 600;
    color: #27ae60;
    text-transform: uppercase;
    opacity: 0;
    transform: translateY(10px);
    transition: 0.3s;
  }

  /* --- Hover Effects --- */
  .filiere-card:hover {
    transform: translateY(-10px);
    border-color: #27ae60;
    box-shadow: 0 20px 40px rgba(26, 92, 55, 0.08);
  }

  .filiere-card:hover .filiere-icon-wrapper {
    background: #1a5c37;
    color: #ffffff;
    transform: scale(1.1);
  }

  .filiere-card:hover .explore-text {
    opacity: 1;
    transform: translateY(0);
  }

  .card-glow {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: radial-gradient(circle at center, rgba(39, 174, 96, 0.05) 0%, transparent 70%);
    opacity: 0;
    transition: 0.4s;
    z-index: -1;
  }
  .filiere-card:hover .card-glow { opacity: 1; }

  /* Responsive */
  @media (max-width: 768px) {
    .main-title { font-size: 1.8rem; }
    .filiere-card { padding: 25px 15px; }
  }
</style>
