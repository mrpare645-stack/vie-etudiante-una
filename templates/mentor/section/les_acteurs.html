<section id="trainers-index" class="actors-section-premium py-5">
  
  <div class="container section-title" data-aos="fade-up">
    <div class="elite-label">Gouvernance & Engagement</div>
    <h2>Les <span class="text-una">Acteurs</span> Clés</h2>
    <p>Ceux qui dynamisent et encadrent la vie estudiantine à l'UNA.</p>
    <div class="title-underline"></div>
  </div>

  <div class="container">
    <div class="row gy-4">
      {% for acteur in acteurs %}
      <div class="col-lg-4 col-md-6" data-aos="fade-up" data-aos-delay="{{ forloop.counter }}00">
        <div class="actor-card">
          
          <div class="actor-img-box">
            <img src="{{acteur.photo.url}}" class="img-fluid" alt="{{acteur.nom}}">
            <div class="actor-social-overlay">
              <div class="social-links-wrapper">
                <a href="{{acteur.twitter}}" title="Twitter"><i class="bi bi-twitter-x"></i></a>
                <a href="{{acteur.facebook}}" title="Facebook"><i class="bi bi-facebook"></i></a>
                <a href="{{acteur.instagram}}" title="Instagram"><i class="bi bi-instagram"></i></a>
                <a href="{{acteur.linkedin}}" title="LinkedIn"><i class="bi bi-linkedin"></i></a>
              </div>
            </div>
          </div>

          <div class="actor-info">
            <div class="role-badge">{{acteur.role}}</div>
            <h4>{{acteur.nom}}</h4>
            <div class="actor-description">
              <p>{{acteur.description|truncatechars:120}}</p>
            </div>
          </div>
          
        </div>
      </div>
      {% endfor %}
    </div>
  </div>
</section>

<style>
  .actors-section-premium {
    background: #ffffff;
    padding: 80px 0;
    font-family: 'Inter', sans-serif;
  }

  /* --- Header de Section --- */
  .text-una { color: #27ae60; }
  .elite-label {
    display: inline-block;
    background: rgba(39, 174, 96, 0.1);
    color: #1a5c37;
    padding: 6px 16px;
    border-radius: 50px;
    font-weight: 700;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-bottom: 15px;
  }
  .title-underline {
    width: 60px;
    height: 4px;
    background: #27ae60;
    margin: 20px auto 0;
    border-radius: 10px;
  }

  /* --- ACTOR CARD --- */
  .actor-card {
    background: #ffffff;
    border-radius: 25px;
    overflow: hidden;
    height: 100%;
    border: 1px solid #f0f0f0;
    transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
    position: relative;
    box-shadow: 0 10px 30px rgba(0,0,0,0.02);
  }

  .actor-card:hover {
    transform: translateY(-10px);
    box-shadow: 0 30px 60px rgba(26, 92, 55, 0.12);
    border-color: #27ae60;
  }

  /* Image & Social Overlay */
  .actor-img-box {
    position: relative;
    height: 350px;
    overflow: hidden;
  }

  .actor-img-box img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: grayscale(20%);
    transition: 0.6s ease;
  }

  .actor-card:hover .actor-img-box img {
    filter: grayscale(0%);
    transform: scale(1.05);
  }

  .actor-social-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(to top, rgba(26, 92, 55, 0.8), transparent);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    padding-bottom: 30px;
    opacity: 0;
    transition: 0.4s;
  }

  .actor-card:hover .actor-social-overlay {
    opacity: 1;
  }

  .social-links-wrapper {
    display: flex;
    gap: 15px;
    transform: translateY(20px);
    transition: 0.4s;
  }

  .actor-card:hover .social-links-wrapper {
    transform: translateY(0);
  }

  .social-links-wrapper a {
    width: 40px;
    height: 40px;
    background: #ffffff;
    color: #1a5c37;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    font-size: 18px;
    transition: 0.3s;
  }

  .social-links-wrapper a:hover {
    background: #27ae60;
    color: #ffffff;
    transform: rotate(360deg);
  }

  /* Info de l'acteur */
  .actor-info {
    padding: 25px;
    text-align: center;
  }

  .role-badge {
    display: inline-block;
    color: #27ae60;
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  .actor-info h4 {
    font-size: 20px;
    font-weight: 800;
    color: #1e293b;
    margin-bottom: 12px;
  }

  .actor-description p {
    font-size: 14px;
    color: #64748b;
    line-height: 1.6;
    margin: 0;
  }

  /* Responsive */
  @media (max-width: 768px) {
    .actor-img-box { height: 300px; }
  }
</style>
